# ============================================================
# EV - CHARGER CONTROL
# ============================================================

# ------------------------------------------------------------
# SCRIPT: EV CHARGE START
# Called by:
#   automation.ev_start_charging_stable
# Calls:
#   script.ev_set_target_ampere
#   rest_command.easee_stop_charging
#   rest_command.easee_start_charging
# ------------------------------------------------------------

ev_charge_start:
  alias: EV Charge Start
  mode: single

  sequence:
    - variables:
        target_ampere: "{{ states('sensor.ev_target_ampere_effective') | int(0) }}"
        min_amp: "{{ states('input_number.ev_min_charge_ampere') | int(7) }}"

    # Afvis ugyldig start før start-delay aktiveres
    - if:
        - condition: template
          value_template: >
            {{ target_ampere < min_amp or target_ampere > 16 }}
      then:
        - action: logbook.log
          data:
            name: EV
            message: >
              Start afvist:
              target={{ target_ampere }} A,
              min={{ min_amp }} A,
              decision={{ states('sensor.ev_charge_decision') }}

        - stop: "Ugyldig target ampere"

    # Hvis bilen allerede lader, skal en ny startsekvens ikke køres
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.eh45khwp_power') | float(0) > 0.5 }}
      then:
        - action: logbook.log
          data:
            name: EV
            message: >
              Start ignoreret - bilen lader allerede
              (power={{ states('sensor.eh45khwp_power') }} kW,
              target={{ target_ampere }} A)

        - stop: "Bilen lader allerede"

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_start_delay_active

    # ---------------------------------------------------------
    # 1. RESET gammel Easee-starttilstand
    # ---------------------------------------------------------

    - action: rest_command.easee_stop_charging

    - delay: "00:00:03"

    # Charger skal være enabled før ny start
    - action: switch.turn_on
      target:
        entity_id: switch.eh45khwp_charger_enabled

    - delay: "00:00:03"

    # ---------------------------------------------------------
    # 2. Sæt ønsket strøm
    # ---------------------------------------------------------

    - action: script.ev_set_target_ampere
      data:
        ampere: "{{ target_ampere }}"

    - delay: "00:00:05"

    # ---------------------------------------------------------
    # 3. Start opladning
    # ---------------------------------------------------------

    - action: rest_command.easee_start_charging

    # Vent på reel ladeeffekt
    - wait_template: >
        {{
          states('sensor.eh45khwp_power') | float(0) > 0.5
          or states('sensor.ev_charge_decision') != 'LAD'
          or is_state('input_boolean.ev_session_active', 'off')
          or is_state('input_boolean.ev_ha_control_enabled', 'off')
        }}
      timeout: "00:00:45"
      continue_on_timeout: true

    # ---------------------------------------------------------
    # 4. Ét komplet retry hvis bilen stadig ikke lader
    # ---------------------------------------------------------

    - if:
        - condition: template
          value_template: >
            {{
              states('sensor.eh45khwp_power') | float(0) < 0.5
              and states('sensor.ev_charge_decision') == 'LAD'
              and is_state('input_boolean.ev_session_active', 'on')
              and is_state('input_boolean.ev_ha_control_enabled', 'on')
            }}
      then:
        - action: logbook.log
          data:
            name: EV
            message: >
              Første startforsøg gav ingen ladeeffekt.
              Kører ét komplet retry
              (target={{ target_ampere }} A,
              status={{ states('sensor.eh45khwp_status') }},
              reason={{ states('sensor.eh45khwp_reason_for_no_current') }})

        - action: rest_command.easee_stop_charging

        - delay: "00:00:03"

        - action: switch.turn_on
          target:
            entity_id: switch.eh45khwp_charger_enabled

        - delay: "00:00:03"

        - action: script.ev_set_target_ampere
          data:
            ampere: "{{ target_ampere }}"

        - delay: "00:00:05"

        - action: rest_command.easee_start_charging

        - wait_template: >
            {{
              states('sensor.eh45khwp_power') | float(0) > 0.5
              or states('sensor.ev_charge_decision') != 'LAD'
              or is_state('input_boolean.ev_session_active', 'off')
              or is_state('input_boolean.ev_ha_control_enabled', 'off')
            }}
          timeout: "00:00:45"
          continue_on_timeout: true

    # ---------------------------------------------------------
    # 5. Startsekvens færdig
    # ---------------------------------------------------------

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_start_delay_active

    - action: logbook.log
      data:
        name: EV
        entity_id: switch.eh45khwp_charger_enabled
        message: >
          Easee startsekvens afsluttet
          (target={{ target_ampere }} A,
          actual_limit={{ states('sensor.eh45khwp_dynamic_charger_limit') }} A,
          last_sent={{ states('input_number.ev_last_sent_ampere') }} A,
          enabled={{ states('switch.eh45khwp_charger_enabled') }},
          status={{ states('sensor.eh45khwp_status') }},
          reason={{ states('sensor.eh45khwp_reason_for_no_current') }},
          power={{ states('sensor.eh45khwp_power') }} kW)

# ------------------------------------------------------------
# SCRIPT: EV CHARGE STOP
# Called by:
#   automation.ev_stop_charging_stable
#   automation.ev_stop_charging_immediate
#   automation.ev_stop_charging_when_stop_mode
# Calls:
#   script.ev_set_target_ampere
#   rest_command.easee_stop_charging
# ------------------------------------------------------------

ev_charge_stop:
  alias: EV Charge Stop
  mode: single
  sequence:
    - action: rest_command.easee_stop_charging

    - delay: "00:00:02"

    - action: script.ev_set_target_ampere
      data:
        ampere: 0

    - delay: "00:00:02"

    - action: switch.turn_on
      target:
        entity_id: switch.eh45khwp_charger_enabled

    - action: logbook.log
      data:
        name: EV
        message: >
          Easee stop_charging sendt og ampere sat til 0
          (charger enabled={{ states('switch.eh45khwp_charger_enabled') }},
          status={{ states('sensor.eh45khwp_status') }},
          reason={{ states('sensor.eh45khwp_reason_for_no_current') }},
          power={{ states('sensor.eh45khwp_power') }},
          last_amp={{ states('input_number.ev_last_sent_ampere') }})

# ------------------------------------------------------------
# SCRIPT: EV SET TARGET AMPERE
# Called by:
#   script.ev_charge_start
#   script.ev_charge_stop
#   automation.ev_apply_target_ampere
# Calls:
#   rest_command.set_ioniq_ampere
# ------------------------------------------------------------

ev_set_target_ampere:
  alias: EV - Set target ampere
  mode: single

  fields:
    ampere:
      description: "Ampere to apply to Easee charger"
      example: 10

  sequence:
    # ---------------------------------------------------------
    # 1. Bestem og valider ønsket ampere
    # ---------------------------------------------------------
    - variables:
        requested_ampere: >
          {% set passed = ampere | default(none) %}
          {% if passed is not none
             and passed not in ['', 'unknown', 'unavailable', 'none'] %}
            {{ passed | int(0) }}
          {% else %}
            {{ states('sensor.ev_target_ampere_effective') | int(0) }}
          {% endif %}

        min_amp: >
          {{ states('input_number.ev_min_charge_ampere') | int(7) }}

    - condition: template
      value_template: >
        {{
          requested_ampere == 0
          or
          (requested_ampere >= min_amp and requested_ampere <= 16)
        }}

    # ---------------------------------------------------------
    # 2. Første forsøg
    # ---------------------------------------------------------
    - action: rest_command.set_ioniq_ampere
      data:
        ampere: "{{ requested_ampere }}"
      response_variable: easee_response_1

    - variables:
        status_1: >
          {{ easee_response_1.status | default(0) | int(0) }}

    - action: logbook.log
      data:
        name: EV REST
        message: >
          Easee ampere forsøg 1:
          requested={{ requested_ampere }} A,
          status={{ status_1 }}

    # ---------------------------------------------------------
    # 3. 401 → refresh token → ét nyt forsøg
    # ---------------------------------------------------------
    - if:
        - condition: template
          value_template: "{{ status_1 == 401 }}"
      then:
        - action: homeassistant.update_entity
          data:
            entity_id: sensor.easee_api_access_token_final_2

        - delay: "00:00:03"

        - action: rest_command.set_ioniq_ampere
          data:
            ampere: "{{ requested_ampere }}"
          response_variable: easee_response_2

        - variables:
            status_final: >
              {{ easee_response_2.status | default(0) | int(0) }}

            content_final: >
              {{ easee_response_2.content | default('') }}

        - action: logbook.log
          data:
            name: EV REST
            message: >
              Easee ampere forsøg 2 efter token-refresh:
              requested={{ requested_ampere }} A,
              status={{ status_final }}

      else:
        - variables:
            status_final: "{{ status_1 }}"

            content_final: >
              {{ easee_response_1.content | default('') }}

    # ---------------------------------------------------------
    # 4. Accepteret kommando
    # ---------------------------------------------------------
    - if:
        - condition: template
          value_template: >
            {{ status_final >= 200 and status_final < 300 }}
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ev_last_sent_ampere
          data:
            value: "{{ requested_ampere }}"

        
        - delay: "00:00:08"

        - action: homeassistant.update_entity
          data:
            entity_id: sensor.eh45khwp_dynamic_charger_limit

        - action: logbook.log
          data:
            name: EV
            message: >
              Easee ampere accepteret:
              requested={{ requested_ampere }} A,
              HTTP={{ status_final }},
              actual_limit={{ states('sensor.eh45khwp_dynamic_charger_limit') }} A

      else:
        - action: input_number.set_value
          target:
            entity_id: input_number.ev_last_sent_ampere
          data:
            value: 0

        - action: logbook.log
          data:
            name: EV WARNING
            message: >
              Easee ampere IKKE accepteret:
              requested={{ requested_ampere }} A,
              HTTP={{ status_final }},
              content={{ content_final }},
              mode={{ states('input_select.ev_charge_mode') }},
              status={{ states('sensor.eh45khwp_status') }},
              reason={{ states('sensor.eh45khwp_reason_for_no_current') }}

        - stop: "Easee afviste ampere-kommandoen"

# ============================================================
# EV - SESSION / SEGMENTS
# ============================================================

# ------------------------------------------------------------
# SCRIPT: EV REBASELINE SESSION FROM PLAN
# Monta Guest only
# Called by:
#   Dashboard - Opdater aktiv session fra plan
# ------------------------------------------------------------
ev_rebaseline_session_from_plan:
  alias: EV Rebaseline Session From Plan
  mode: single

  sequence:
    - condition: state
      entity_id: input_select.ev_charge_mode
      state: 'Monta Guest'

    - condition: state
      entity_id: input_boolean.ev_session_active
      state: 'on'

    - variables:
        start_soc: >
          {{ states('input_number.ev_guest_planned_start_soc') | float(0) }}
        target_soc: >
          {{ states('input_number.ev_guest_planned_target_soc') | float(80) }}
        battery_kwh: >
          {{ states('input_number.ev_guest_planned_battery_kwh') | float(77) }}
        easee_energy: >
          {{ states('sensor.eh45khwp_session_energy') | float(0) }}

    - condition: template
      value_template: >
        {{ start_soc >= 0
           and start_soc < target_soc
           and target_soc <= 100
           and battery_kwh > 0 }}

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_session_start_soc
      data:
        value: "{{ start_soc }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_session_target_soc
      data:
        value: "{{ target_soc }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_session_battery_kwh
      data:
        value: "{{ battery_kwh }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_session_energy_latched_kwh
      data:
        value: 0

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_session_easee_start_energy_kwh
      data:
        value: "{{ easee_energy }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_soc_correction
      data:
        value: 0

    - action: logbook.log
      data:
        name: EV
        message: >
          Monta Guest session rebaselinet fra plan
          (start_soc={{ start_soc }},
          target_soc={{ target_soc }},
          battery={{ battery_kwh }} kWh,
          easee_start_energy={{ easee_energy }} kWh)

# ------------------------------------------------------------
# SCRIPT: EV SEGMENT OPEN
# Formål:
#   Åbner et energisegment når bilen faktisk lader.
#
# Segmentets energibaseline er altid HA's latchede
# sessionenergi:
#   input_number.ev_session_energy_latched_kwh
#
# Scriptet gør ingenting hvis:
#   - sessionen ikke er aktiv
#   - bilen ikke leverer reel ladeeffekt
#   - segment allerede er åbent
#   - ampere er ugyldig
# ------------------------------------------------------------

ev_segment_open:
  alias: EV - Segment open
  mode: single

  fields:
    ampere:
      description: "Ampere for det nye segment. Hvis udeladt bruges effective target."
      example: 10

  sequence:
    - variables:
        min_amp: "{{ states('input_number.ev_min_charge_ampere') | int(7) }}"

        requested_ampere: >
          {% set passed = ampere | default(none) %}
          {% if passed is not none
             and passed not in ['', 'unknown', 'unavailable', 'none'] %}
            {{ passed | int(0) }}
          {% else %}
            {{ states('sensor.ev_target_ampere_effective') | int(0) }}
          {% endif %}

        current_energy: >
          {{
            states('input_number.ev_session_energy_latched_kwh')
            | float(0)
            | round(3)
          }}

        now_text: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    - condition: template
      value_template: >
        {{
          is_state('input_boolean.ev_session_active', 'on')
          and is_state('input_boolean.ev_segment_open', 'off')
          and states('sensor.eh45khwp_power') | float(0) > 0.5
          and requested_ampere >= min_amp
          and requested_ampere <= 16
        }}

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_segment_ampere
      data:
        value: "{{ requested_ampere }}"

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ev_segment_started_at
      data:
        datetime: "{{ now_text }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_segment_start_energy_kwh
      data:
        value: "{{ current_energy }}"

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_segment_open

    - action: logbook.log
      data:
        name: EV Segment
        message: >
          Segment åbnet:
          amp={{ requested_ampere }} A,
          start_energy={{ current_energy }} kWh,
          power={{ states('sensor.eh45khwp_power') }} kW


# ------------------------------------------------------------
# SCRIPT: EV SEGMENT CLOSE
# Formål:
#   Lukker og logger det aktuelle energisegment.
#
# Segmentenergi:
#   current session latched energy
#   minus
#   segment start latched energy
#
# Scriptet lukker segmenttilstanden før CSV-logning.
# Dermed kan samme segment ikke logges to gange af to
# forskellige triggere.
# ------------------------------------------------------------

ev_segment_close:
  alias: EV - Segment close
  mode: single

  fields:
    reason:
      description: "Årsag til segmentlukning"
      example: "ampere_change"

  sequence:
    - condition: state
      entity_id: input_boolean.ev_segment_open
      state: 'on'

    - variables:
        started_at: "{{ states('input_datetime.ev_segment_started_at') }}"
        ended_at: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        start_energy: >
          {{
            states('input_number.ev_segment_start_energy_kwh')
            | float(0)
          }}

        end_energy: >
          {{
            states('input_number.ev_session_energy_latched_kwh')
            | float(0)
          }}

        segment_kwh: >
          {{
            [
              (
                states('input_number.ev_session_energy_latched_kwh') | float(0)
                -
                states('input_number.ev_segment_start_energy_kwh') | float(0)
              ),
              0
            ]
            | max
            | round(3)
          }}

        segment_ampere: >
          {{ states('input_number.ev_segment_ampere') | int(0) }}

        mode: >
          {{ states('input_text.ev_session_mode_latched') }}

        close_reason: >
          {{ reason | default('unknown') }}

    # Claim segmentet først.
    # Hvis en anden automation udløses umiddelbart bagefter,
    # ser den segment_open = off og kan derfor ikke logge igen.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_segment_open

    - if:
        - condition: template
          value_template: "{{ segment_kwh > 0.01 }}"
      then:
        - action: script.ev_log_segment_csv
          data:
            line: >-
              {{ [
                'segment_stop',
                started_at,
                ended_at,
                mode,
                segment_ampere,
                segment_kwh,
                end_energy | round(3),
                states('input_number.ev_session_start_soc'),
                states('input_number.ev_session_target_soc'),
                states('input_number.ev_session_battery_kwh')
              ] | join(',') }}

        - action: input_text.set_value
          target:
            entity_id: input_text.ev_last_segment_summary
          data:
            value: >
              {{ started_at }} → {{ ended_at }}
              · mode={{ mode }}
              · amp={{ segment_ampere }} A
              · energy={{ segment_kwh }} kWh
              · reason={{ close_reason }}

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_segment_start_energy_kwh
      data:
        value: "{{ end_energy | round(3) }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_segment_ampere
      data:
        value: 0

    - action: logbook.log
      data:
        name: EV Segment
        message: >
          Segment lukket:
          reason={{ close_reason }},
          amp={{ segment_ampere }} A,
          energy={{ segment_kwh }} kWh,
          session_energy={{ end_energy | round(3) }} kWh          

# ============================================================
# EV - CSV LOGGING
# ============================================================

# ------------------------------------------------------------
# SCRIPT: EV LOG SEGMENT CSV
# Called by:
#   automation.ev_segment_close_on_ampere_change
#   automation.ev_segment_close_on_charging_stop
#   automation.ev_segment_close_on_manual_stop
# ------------------------------------------------------------

ev_log_segment_csv:
  alias: EV - Log segment CSV
  mode: queued
  fields:
    line:
      description: CSV line
  sequence:
    - action: logbook.log
      data:
        name: EV CSV Segment Writer
        message: >
          Skriver segment CSV:
          {{ line }}

    - action: shell_command.ev_append_segment_csv
      data:
        line: "{{ line }}"

# ------------------------------------------------------------
# SCRIPT: EV LOG SESSION CSV
# Called by:
#   automation.ev_session_finish_on_logical_stop
# ------------------------------------------------------------

ev_log_session_csv:
  alias: EV - Log session CSV
  mode: queued
  fields:
    line:
      description: CSV line
  sequence:
    - action: shell_command.ev_append_session_csv
      data:
        line: "{{ line }}"

# ============================================================
# INTELLICHARGE
# ============================================================

# ------------------------------------------------------------
# SCRIPT: INTELLICHARGE APPLY SMART
# Called by:
#   automation.intellicharge_release_ev_override
#   automation.intellicharge_recover_after_restart
#   automation.ev_ha_control_disabled_failsafe
# ------------------------------------------------------------

intellicharge_apply_smart:
  alias: IntelliCharge → Smart
  mode: single
  sequence:
    - if:
        - condition: template
          value_template: >
            {{ is_state('sensor.ev_intellicharge_smart_status_2', 'Smart') }}
      then:
        - stop: "IntelliCharge er allerede Smart"

    - service: rest_command.intellicharge_set_smart

    - delay: "00:00:08"

    - service: homeassistant.update_entity
      target:
        entity_id: sensor.ev_intellicharge_smart_status_2

    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.intellicharge_smart_enabled

    - service: input_select.select_option
      target:
        entity_id: input_select.intellicharge_desired_mode
      data:
        option: "Smart"

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ev_intellicharge_last_change
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# ------------------------------------------------------------
# SCRIPT: INTELLICHARGE APPLY ALLOW
# Called by:
#   automation.intellicharge_acquire_ev_override
#   automation.intellicharge_release_ev_override
#   automation.intellicharge_recover_after_restart
# ------------------------------------------------------------

intellicharge_apply_allow:
  alias: IntelliCharge → Allow Always
  mode: single
  sequence:
    - if:
        - condition: template
          value_template: >
            {{ is_state('sensor.ev_intellicharge_smart_status_2', 'Allow Always') }}
      then:
        - stop: "IntelliCharge er allerede Allow Always"

    - service: rest_command.intellicharge_set_allow_always

    - delay: "00:00:08"

    - service: homeassistant.update_entity
      target:
        entity_id: sensor.ev_intellicharge_smart_status_2

    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.intellicharge_smart_enabled

    - service: input_select.select_option
      target:
        entity_id: input_select.intellicharge_desired_mode
      data:
        option: "Allow Always"

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ev_intellicharge_last_change
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# ============================================================
# NOTIFICATIONS
# ============================================================

# ------------------------------------------------------------
# SCRIPT: SPEAK TO LARS
# Called by:
#   Ingen kald fundet i automations.yaml
#   Kan kaldes manuelt eller andetsteds
# ------------------------------------------------------------

speak_to_lars:
  alias: Speak to Lars
  mode: restart
  fields:
    text:
      required: true
  sequence:
    - action: notify.mobile_app_pixel_10_pro
      data:
        message: TTS
        data:
          tts_text: "{{ text }}"

# ------------------------------------------------------------
# SCRIPT: WAKE AND SPEAK
# Called by:
#   Ingen kald fundet i automations.yaml
#   Kan kaldes manuelt eller andetsteds
# ------------------------------------------------------------

wake_and_speak:
  alias: Wake And Speak
  mode: restart
  fields:
    text:
      required: true

  sequence:

    - action: notify.mobile_app_pixel_10_pro
      data:
        title: "HA"
        message: "Vækker telefonen"
        data:
          channel: alarm_stream
          ttl: 0
          priority: high

    - delay:
        seconds: 2

    - action: notify.mobile_app_pixel_10_pro
      data:
        message: TTS
        data:
          tts_text: "{{ text }}"

# ============================================================
# KITCHEN
# ============================================================

# ------------------------------------------------------------
# SCRIPT: KOKKEN TAEND ALT
# Called by:
#   automation.kokken_presence_light_on
# ------------------------------------------------------------

kokken_taend_alt:
  alias: Køkken - Tænd alt lys
  sequence:
    - action: light.turn_on
      target:
        entity_id:
          - light.kokkenloftb
          - light.kokkenloftf

    - action: switch.turn_on
      target:
