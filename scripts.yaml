        message: TTS
        data:
          tts_text: "{{ text }}"
  
wake_and_speak:
  alias: Wake And Speak
  mode: restart
  fields:
    text:
      required: true

  sequence:

    - action: notify.mobile_app_pixel_10_pro
      data:
        title: "HA"
        message: "Vækker telefonen"
        data:
          channel: alarm_stream
          ttl: 0
          priority: high

    - delay:
        seconds: 2

    - action: notify.mobile_app_pixel_10_pro
      data:
        message: TTS
        data:
          tts_text: "{{ text }}"

